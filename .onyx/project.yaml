repo:
  provider: github
  owner: Swartdraak
  name: Bibliophilarr-DevContainer
  id: 1352424661
  url: https://github.com/Swartdraak/Bibliophilarr-DevContainer
  default_branch: main
  visibility: public
  language: TypeScript (coderops/mcp), Bash (scripts, image, workspace), HCL (template)

base_sha: 41481c9e3ffff255d5aa6d6400392f21b5ed9608
audit_date: "2026-09-24"
revalidation:
  task: t_30aa8dbb
  mode: existing-pr-intake (PR #19, zod ^3.25.76 -> ^4.6.5 RUNTIME MAJOR)
  revalidated_at: "2026-09-24"
  notes: >
    All bootstrap/build/lint/unit/integration/security commands
    re-executed and verified in the Onyx Docker audit container (node
    v20.20.2, npm 10.8.2) at the picked-up work-branch head 7f796ea6
    (single Dependabot commit ahead of main @ 41481c9e — fresh
    2026-09-24T21:25:20Z rebase; guard merge of origin/main confirmed
    NO-OP "Already up to date"). zod 4.6.5 is a RUNTIME MAJOR jump:
    the compatibility gate = tsc strict (TS 7.0.2 tsgo) zero
    diagnostics + 5/5 node --test + MCP stdio initialize at the
    picked-up head — all green, plus an explicit zod 4 API surface
    probe (z.object/z.string().email() parse/safeParse semantics).
    The picked-up head retains all three published bumps (yaml 2.9.1,
    typescript 7.0.2, @types/node 26.6.2) plus zod 4.6.5 (116 total
    packages, 0 vulnerabilities). No command was added,
    removed or re-scoped.
environment:
  node: "v20.20.2 (matches toolchain.json nodeMajor=20 and CI runner ubuntu-24.04)"
  npm: "10.8.2"
  typescript: "7.0.2 (Go-based tsgo native compiler; dev-only, /coderops/mcp)"
  python: "3.11.15"
  terraform: "not installed in audit container (required version 1.9.8 per CI)"
  shellcheck: "not installed in audit container"
  docker: "no daemon (DinD not enabled)"
  os: "Linux (Hermes Docker workspace)"

components:
  - name: image
    path: image/
    description: >
      Canonical multi-IDE execution-environment Docker image
      (ghcr.io/swartdraak/bibliophilarr-agent-workspace, version 0.2.9 per
      toolchain.json). Requires Docker build + Docker-in-Docker to test.
  - name: template
    path: template/
    description: >
      Docker-runtime Coder provisioning template (Terraform + coder provider
      2.18.0, docker provider 3.9.0). No live deployment automation.
  - name: coderops
    path: coderops/
    description: >
      CoderOps control layer: TypeScript MCP server/CLI (coderops/mcp,
      @bibliophilarr/coderops-mcp v0.1.0), agents, skills, instructions,
      JSON schemas, generated client adapters, bootstrap scripts.
  - name: scripts
    path: scripts/
    description: Ref-safe bootstrap, inventory, model and candidate validation.
  - name: workspace-bin
    path: workspace/bin
    description: Agent-runtime and privacy-safe media utilities for the image.
  - name: devcontainer
    path: .devcontainer
    description: Thin local devcontainer adapter over the canonical image.

# All commands run from the repository root unless noted.
bootstrap:
  - id: coderops-deps
    command: cd coderops/mcp && npm ci
    verified: true
    notes: Lockfile-driven install, 116 total packages in the tree (npm ci reports 99 added), exit 0, 0 vulnerabilities (re-verified 2026-09-24 at PR #19 picked-up head 7f796ea6: typescript 7.0.2 + 8 tsgo platform binaries, @types/node 26.6.2 + undici-types 8.9.0, yaml 2.9.1, zod 4.6.5).

build:
  - id: coderops-build
    command: cd coderops/mcp && npm run build
    verified: true
    notes: "tsc -p tsconfig.json (typescript 7.0.2 tsgo native binary), strict, zero diagnostics, exit 0."

lint:
  - id: bash-syntax
    command: >
      for f in $(find scripts image/scripts workspace/bin tests coderops/scripts -type f);
      do bash -n "$f" || exit 1; done
    verified: true
    notes: 31/31 shipped shell scripts pass bash -n.
  - id: shellcheck
    command: >
      find scripts image/scripts workspace/bin tests -type f -print0
      | xargs -0 shellcheck
    verified: false
    notes: SKIPPED in audit container (no shellcheck); CI runs it on ubuntu-24.04.
  - id: terraform-fmt
    command: terraform -chdir=template fmt -check -recursive
    verified: false
    notes: SKIPPED in audit container (no terraform); CI pins terraform 1.9.8.

unit:
  - id: coderops-test
    command: cd coderops/mcp && npm test
    verified: true
    notes: node --test; 5/5 pass (redaction, policy observer/operator, mutation classification, change-plan shape).
  - id: checkout-test
    command: ./tests/test-checkout.sh
    verified: true
    notes: PASS, including the 2026-09-02 fresh --no-checkout regression guard.
  - id: media-safety-test
    command: MEDIA_SELF_TEST=1 ./tests/test-media.sh
    verified: true
    notes: PASS; bounded TMPDIR scratch (set TMPDIR to an exec-allowed path on minimal runners).

integration:
  - id: coderops-doctor
    command: XDG_STATE_HOME=<scratch> coderops/scripts/coderops-doctor
    verified: true
    notes: >
      Runs and reports overall: DEGRADED (coder unauthenticated, ai disabled,
      mcp unavailable) with exit 1 outside a Coder deployment — expected
      environment state, not a code fault.
  - id: coderops-mcp-smoke
    command: >
      echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"onyx-audit","version":"0"}}}'
      | node coderops/mcp/dist/src/server.js
    verified: true
    notes: MCP server answers initialize over stdio (serverInfo coderops 0.1.0), exit 0.
  - id: adapter-drift
    command: coderops/scripts/generate-adapters.sh   # run against a throwaway copy only
    verified: true
    notes: >
      Script works; drift observation — .github/ and .agents/ contain 9 files
      (5 agents, 3 skills, 1 instructions) with no source in coderops/, so
      .github/ cannot be regenerated byte-identical from coderops/ alone.
      Pre-existing governance gap (see pre_existing_faults in baseline.json).

security:
  - id: secret-scan
    command: >
      grep -rnI -E "CODER_SESSION_TOKEN CODER_TOKEN ghp_ github_pat_ xox[baprs]- sk-[A-Za-z0-9]{20,}"
      --exclude-dir=.git --exclude-dir=.terraform .
      | grep -vE 'example|placeholder|<|redacted|\$\{|process\.env|os\.environ|: *""'
    verified: true
    notes: >
      No high-confidence secret literals found. All hits for token variable
      names are code referencing environment-variable NAMES (redaction
      patterns, config, docs), which the CI's own filter also accepts.

runtime:
  - id: image-build
    command: docker build -f image/Dockerfile -t workspace:test .
    verified: false
    notes: SKIPPED — no Docker daemon in audit container; CI image job covers it.
  - id: image-self-test
    command: docker run --rm --entrypoint /usr/local/bin/image-self-test.sh workspace:test
    verified: false
    notes: SKIPPED — no Docker daemon in audit container; CI image job covers it.
  - id: local-llm-verify
    command: workspace/bin/verify-local-llm --quick
    verified: false
    notes: SKIPPED — no local LLM endpoint in audit container.

ci:
  - id: validate-workflow
    file: .github/workflows/validate.yml
    jobs:
      - static: terraform fmt/init/validate, shell syntax, shellcheck, JSON validation, git diff --check, test-checkout.sh, test-media.sh, secret scan
      - image: docker build canonical image + image-self-test
    notes: Runs on push to main/feat/**, pull_request, and workflow_dispatch.

deployment:
  policy: >
    Coder template publication (scripts/publish-coder-template.sh) and image
    publication are deliberately separate, human-gated operations. Autonomous
    deployment is authorized ONLY for isolated testing / semi-production
    validation with synthetic data, scoped access, and a cleanup plan.
    Production or enterprise deployment is prohibited.
  rollback: >
    The repo is source-controlled infrastructure-as-code: rollback = revert
    the offending commit/PR and republish via the gated scripts; no live-state
    mutation occurs from this repo.

skipped_integrations:
  - terraform fmt/init/validate (no terraform binary in audit container)
  - shellcheck (no shellcheck binary in audit container)
  - docker build + image self-test (no Docker daemon / DinD)
  - live Coder API/CLI (no Coder deployment; out of scope)
  - local vLLM verification (no LLM endpoint)

pre_existing_faults:
  - >
    Adapter source-of-truth gap: .github/agents + .github/skills +
    .github/instructions (and mirrored .agents/) contain 9 files that
    generate-adapters.sh does not produce from coderops/ sources
    (5 bibliophilarr-*.agent.md agents, skills coder-deploy/coder-modules/
    coder-templates, coder-live-operations.instructions.md). Because the
    generator copies but never deletes, .github/ cannot be regenerated
    byte-identical. Recorded as a governance observation for the owner,
    not fixed by onboarding (behavior change is out of scope).
  - >
    Advisory (owner decision, NOT a gate, recorded at PR #20 audit
    t_6197695d): @types/node 26.6.2 typings span node major lines while
    toolchain.json nodeMajor=20 and CI runners use node 20.x. Empirical
    result at the picked-up head: tsc strict (TS 7.0.2) zero diagnostics,
    5/5 tests pass, MCP handshake OK — no 26.x-vs-20.x typing
    inconsistency surfaced. Pin latest @types/node 20.x only if 26.x
    typings later prove inconsistent with the 20.x runtime.
